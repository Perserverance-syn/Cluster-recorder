apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.collector.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.collector.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-recorder
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cluster-recorder
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
spec:
  replicas: 1                # single writer on a ReadWriteOnce volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-recorder
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-recorder
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      # Runs under Pod Security Admission `restricted`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STORAGE_BACKEND
              value: {{ .Values.collector.storage.backend | quote }}
            - name: STORAGE_DSN
              value: {{ .Values.collector.storage.dsn | quote }}
            - name: STORAGE_MAX_MB
              value: {{ .Values.collector.storage.maxSizeMB | quote }}
            - name: RETENTION_EVENTS
              value: {{ .Values.collector.retention.events | quote }}
            - name: RETENTION_CHANGES
              value: {{ .Values.collector.retention.changes | quote }}
            - name: RETENTION_SNAPSHOTS
              value: {{ .Values.collector.retention.snapshots | quote }}
            - name: INCIDENT_POD_THRESHOLD
              value: {{ .Values.collector.incident.podThreshold | quote }}
            - name: INCIDENT_NS_THRESHOLD
              value: {{ .Values.collector.incident.namespaceThreshold | quote }}
            - name: INCIDENT_WINDOW_MIN
              value: {{ .Values.collector.incident.windowMinutes | quote }}
            - name: BASELINE_STABLE_MIN
              value: {{ .Values.collector.baseline.stableMinutes | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.collector.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /api/v1/healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/v1/readyz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: azure/setup-helm@v4
      - run: make fmt-check vet test-race
      - run: make helm-lint
      - run: make manifests-check
      - run: make docs-check
      # A values.yaml change must ship with a CONFIGURATION.md change in the same PR.
      - name: values/CONFIGURATION coupling
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^deploy/helm/values.yaml$' && ! echo "$changed" | grep -q '^docs/CONFIGURATION.md$'; then
            echo "deploy/helm/values.yaml changed without docs/CONFIGURATION.md"; exit 1
          fi

  e2e:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: recorder-e2e}
      - run: make e2e

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/perserverance-syn/cluster-recorder:${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: build recorderctl for every platform
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/recorderctl-$os-$arch$ext" ./cmd/recorderctl
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
